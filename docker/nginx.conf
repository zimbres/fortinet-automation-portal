pid /tmp/nginx.pid;
error_log /dev/stdout warn;
events {}
http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    log_format portal '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout portal;
    server {
        listen 8080;
        return 301 https://$host$request_uri;
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 3m;
        location /static/ { alias /srv/static/; }
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_read_timeout 45s;
        }
    }
}
