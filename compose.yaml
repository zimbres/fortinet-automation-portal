x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    PORTAL_ENCRYPTION_KEYS_FILE: /run/secrets/encryption_keys
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set the portal hostname}
    PORTAL_AUTH_MODE: ${PORTAL_AUTH_MODE:?Choose local or oidc explicitly}
    OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-60}
    OIDC_OP_ISSUER: ${OIDC_OP_ISSUER:-}
    OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID:-}
    OIDC_RP_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    OIDC_OP_AUTHORIZATION_ENDPOINT: ${OIDC_OP_AUTHORIZATION_ENDPOINT:-}
    OIDC_OP_TOKEN_ENDPOINT: ${OIDC_OP_TOKEN_ENDPOINT:-}
    OIDC_OP_USER_ENDPOINT: ${OIDC_OP_USER_ENDPOINT:-}
    OIDC_OP_JWKS_ENDPOINT: ${OIDC_OP_JWKS_ENDPOINT:-}
  secrets:
    - django_secret_key
    - encryption_keys
    - oidc_client_secret
  volumes:
    - ./data:/app/data
    - staticfiles:/app/staticfiles
  restart: unless-stopped

services:
  web:
    <<: *app
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':__import__('os').environ['DJANGO_ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - staticfiles:/srv/static:ro
    secrets: [tls_certificate, tls_private_key]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staticfiles:

secrets:
  django_secret_key:
    file: ${DJANGO_SECRET_KEY_PATH:-./secrets/django_secret_key}
  encryption_keys:
    file: ${ENCRYPTION_KEYS_PATH:-./secrets/encryption_keys}
  oidc_client_secret:
    file: ${OIDC_CLIENT_SECRET_PATH:-./secrets/oidc_client_secret}
  tls_certificate:
    file: ${TLS_CERTIFICATE_PATH:-./secrets/tls_certificate}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_PATH:-./secrets/tls_private_key}
