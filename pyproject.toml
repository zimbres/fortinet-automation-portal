[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "fortinet-automation-portal"
version = "0.1.0"
description = "Internal portal for independently approved Fortinet automation"
requires-python = ">=3.14,<3.15"
dependencies = [
  "Django>=6.1.2,<6.2",
  "Pillow>=13.0.0,<14",
  "httpx>=0.28.1,<0.29",
  "cryptography>=50.0.2,<51",
  "mozilla-django-oidc>=5.0.2,<6",
  "gunicorn>=26.2.0,<27; sys_platform != 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "pytest-django>=4.14.0,<5"]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.cache/pytest"
